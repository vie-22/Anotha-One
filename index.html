<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Feby ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#ffd9e8;
overflow:hidden;
}
   
/* Floating Hearts */

.hearts{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
z-index:0;
}

.heart{
position:absolute;
bottom:-30px;
color:#ff7ea8;
animation:float linear infinite;
opacity:.45;
}

/* Floating PNGs */

.floating-img{
position:absolute;
bottom:-80px;

width:40px;      /* Change size here */
height:auto;

pointer-events:none;
opacity:.65;

animation:float linear infinite;
}
   
@keyframes float{
0%{
transform:translateY(0) scale(1);
opacity:.4;
}
100%{
transform:translateY(-120vh) translateX(40px) scale(1.5);
opacity:0;
}
}

/* Intro */

#intro{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
position:relative;
z-index:2;
}

#photo{
    width:250px;
    height:250px;

    object-fit:contain;
    background:transparent;
    border:none;
    box-shadow:none;

    cursor:pointer;

    animation:heartbeat 1.6s ease-in-out infinite;

    transform-origin:center center;
    transition:transform .3s;
}
@keyframes heartbeat{

    0%{
        transform:scale(1);
    }

    12%{
        transform:scale(1.12);
    }

    24%{
        transform:scale(0.98);
    }

    36%{
        transform:scale(1.15);
    }

    48%{
        transform:scale(1);
    }

    100%{
        transform:scale(1);
    }

}
/* Loading */

#loading{
display:none;
height:100vh;
justify-content:center;
align-items:center;
font-size:40px;
font-family:'Caveat',cursive;
color:#b94d77;
}

/* Letter */

#letterPage{
display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100vh;

overflow-y:auto;

padding-top:200px;
padding-bottom:80px;

z-index:5;
}

.paper{
width:90%;
max-width:850px;
margin:auto;

background-color:#fffef9;

background-image:
linear-gradient(
    to bottom,
    transparent 0px,
    transparent 38px,
    #f3d6df 39px
);

background-size:100% 40px;

padding:60px;

border-radius:15px;
box-shadow:0 10px 35px rgba(0,0,0,.15);

font-family:'Caveat',cursive;
font-size:32px;
line-height:40px;
color:#444;

text-align:justify; /* makes the letter justified */

white-space:normal;
text-align:justify;

/* Unfold animation */
opacity:0;

transform:
perspective(1200px)
rotateX(-80deg)
scale(.92);

transform-origin:top center;

transition:
transform 1.2s ease,
opacity 1s ease;
}
   
/* ===========================
   MUSIC PLAYER
=========================== */

.player{
    display:none;
    flex-direction:column;
    align-items:center;

    position:fixed;
    top:-180px;
    left:50%;
    transform:translateX(-50%);

    width:min(95vw,560px);

    background:rgba(255,255,255,.97);
    backdrop-filter:blur(12px);

    padding:16px;
    border-radius:28px;

    box-shadow:0 10px 30px rgba(255,120,170,.18);

    z-index:9999;

    transition:top .7s ease;
}

.song-info{

text-align:center;

margin-bottom:12px;

}

.song-title{

font-size:19px;
font-weight:600;

color:#b84d73;

}

.artist{

font-size:13px;

color:#d58aa6;

margin-top:3px;

}

.player-controls{
    display:flex;
    align-items:center;
    justify-content:center;

    width:100%;

    gap:10px;

    background:#f5f5f5;

    padding:12px;

    border-radius:999px;

    box-sizing:border-box;

    overflow:hidden;
}

.control-btn{

width:44px;
height:44px;

border:none;

border-radius:50%;

background:#ff8fb7;

color:white;

font-size:18px;

cursor:pointer;

flex-shrink:0;

transition:.25s;

}

.control-btn:hover{

transform:scale(1.05);

background:#ff73a7;

}

#currentTime,
#duration{

font-size:14px;

color:#666;

min-width:38px;

text-align:center;

}

#timeline{
    flex:1;
    min-width:0;
    width:auto;

    appearance:none;
    -webkit-appearance:none;

    height:6px;

    background:#d9bfd0;
    border-radius:999px;
}

#timeline::-webkit-slider-thumb{

appearance:none;

width:15px;
height:15px;

border-radius:50%;

background:#ff6fa4;

cursor:pointer;

}
   
/* ===========================
   Mobile Responsive
=========================== */

@media (max-width:768px){

.player{
width:calc(100% - 16px);
padding:10px;
top:-170px;
}

.song-title{
font-size:15px;
}

.artist{
font-size:11px;
}

.player-row{
padding:8px 10px;
gap:6px;
}

.control-btn{
width:34px;
height:34px;
font-size:14px;
flex-shrink:0;
}

#timeline{
flex:1;
min-width:0;
}

#currentTime,
#duration{
font-size:10px;
min-width:28px;
}

#letterPage{
padding-top:165px;
}

.paper{
width:92%;
padding:35px 25px;
font-size:25px;
line-height:1.7;
border-radius:12px;
}

/* Loading */

#loading{
font-size:32px;
padding:20px;
text-align:center;
}

}
@media (max-width:430px){

.player{
    width:95%;
    max-width:95%;
    padding:10px;
    border-radius:20px;
    overflow:hidden;          /* prevents the white pill from sticking out */
}

.song-title{
    font-size:15px;
}

.artist{
    font-size:11px;
}

.player-controls{
    display:flex;
    align-items:center;
    justify-content:center;

    width:100%;
    overflow:hidden;

    gap:4px;
    padding:8px;

    border-radius:999px;
}

.control-btn{
    width:34px;
    height:34px;
    font-size:14px;

    flex:0 0 34px;
}

#currentTime,
#duration{
    font-size:10px;
    min-width:26px;
    flex:0 0 26px;
}

#timeline{
    flex:1 1 auto;
    min-width:0;
    width:auto;
}

#letterPage{
    padding-top:150px;
}

.paper{
    padding:28px 20px;
    font-size:22px;
}
}
   
</style>

</head>
<body>

<div class="hearts" id="hearts"></div>

<!-- Intro -->

<div id="intro">

<img src="car.png" id="photo">

<div class="tap">
Don't be shy, tap me! 💗
</div>

</div>

<!-- Loading -->

<div id="loading">

<span id="loadingText">
Loading Vie's message
</span>

</div>

<!-- Music Player -->

<div class="player" id="player">

    <div class="song-info">
        <div class="song-title">🍓 Strawberries & Cigarettes</div>
        <div class="artist">Troye Sivan</div>
    </div>

    <div class="player-controls">

        <button class="control-btn" id="playPause">⏸</button>

        <span id="currentTime">0:00</span>

        <input type="range" id="timeline" value="0">

        <span id="duration">0:00</span>

        <button class="control-btn" id="muteBtn">🔊</button>

    </div>

</div>
   
<!-- Letter -->

<div id="letterPage">

<div class="paper">

To: My Febylat :P

   



Yours,
<b>Vie</b>

</div>

</div>

<audio id="music" src="Strawberries & Cigarettes.mp3" loop></audio>

<script>

// Hearts
const hearts = document.getElementById("hearts");

for(let i = 0; i < 25; i++){

    let h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "❤";

    h.style.left = Math.random()*100 + "%";
    h.style.fontSize = (10 + Math.random()*12) + "px";
    h.style.animationDuration = (12 + Math.random()*8) + "s";
    h.style.animationDelay = Math.random()*8 + "s";

    hearts.appendChild(h);
}

// Floating PNGs
for(let i = 0; i < 10; i++){

    let img = document.createElement("img");
    img.className = "floating-img";

    img.src = "lily.png"; // change to your PNG name

    img.style.left = Math.random()*100 + "%";
    img.style.width = (25 + Math.random()*20) + "px";
    img.style.animationDuration = (15 + Math.random()*8) + "s";
    img.style.animationDelay = Math.random()*8 + "s";

    hearts.appendChild(img);
}

// Tap

const photo=document.getElementById("photo");
const intro=document.getElementById("intro");
const loading=document.getElementById("loading");
const letter=document.getElementById("letterPage");

const music=document.getElementById("music");
const player=document.getElementById("player");
const loadingText = document.getElementById("loadingText");

let dots = 0;

setInterval(()=>{

dots=(dots+1)%4;

loadingText.textContent=
"Loading Vie's message"+ ".".repeat(dots);

},450);
   
photo.onclick = () => {

  music.play().catch(err => {
    console.log(err);
});

    intro.style.display = "none";
    loading.style.display = "flex";

    setTimeout(() => {

        loading.style.display = "none";
        letter.style.display = "block";

        // Unfold the paper
        const paper = document.querySelector(".paper");

        paper.style.opacity = "1";
        paper.style.transform =
            "perspective(1200px) rotateX(0deg) scale(1)";

        // Show the music player
        player.style.display = "flex";

        setTimeout(() => {
    player.style.top = "12px";
}, 50);
    }, 2500);

};
// ===========================
// Music Player Controls
// ===========================

const playPause = document.getElementById("playPause");
const muteBtn = document.getElementById("muteBtn");
const timeline = document.getElementById("timeline");
const currentTimeText = document.getElementById("currentTime");
const durationText = document.getElementById("duration");

// Convert seconds to MM:SS
function formatTime(seconds) {
    if (isNaN(seconds)) return "0:00";

    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);

    return `${mins}:${secs < 10 ? "0" : ""}${secs}`;
}

// Wait until the audio loads
music.addEventListener("loadedmetadata", () => {
    timeline.max = Math.floor(music.duration);
    durationText.textContent = formatTime(music.duration);
});

// Update the timeline while playing
music.addEventListener("timeupdate", () => {
    timeline.value = Math.floor(music.currentTime);
    currentTimeText.textContent = formatTime(music.currentTime);
});

// Seek
timeline.addEventListener("input", () => {
    music.currentTime = timeline.value;
});

// Play / Pause
playPause.addEventListener("click", () => {

    if (music.paused) {
        music.play();
        playPause.innerHTML = "⏸";
    } else {
        music.pause();
        playPause.innerHTML = "▶";
    }

});

// Mute
muteBtn.addEventListener("click", () => {

    music.muted = !music.muted;

    if (music.muted) {
        muteBtn.innerHTML = "🔇";
    } else {
        muteBtn.innerHTML = "🔊";
    }

});

</script>

</body>
</html>
